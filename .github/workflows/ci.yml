name: Chalkwise checks

on:
  pull_request:
  push:
    branches: [integration, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run check
      - name: Audit dependencies (moderate findings still require release review)
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --prefix server --audit-level=high
      - name: Build explicit demo artifact
        run: node scripts/build-release.mjs --demo
      - name: Build API artifact with non-live test identifiers
        run: node scripts/build-release.mjs
        env:
          EXPO_PUBLIC_DATA_MODE: api
          EXPO_PUBLIC_API_URL: https://api.chalkwise.invalid
          EXPO_PUBLIC_AWS_REGION: us-east-1
          EXPO_PUBLIC_COGNITO_CLIENT_ID: citestpublicclient
      - uses: actions/upload-artifact@v7
        with:
          name: web-builds-test-config-not-for-deployment
          path: |
            dist/mock
            dist/api
          if-no-files-found: error
          retention-days: 7
      - run: git diff --check

  database-isolation:
    # The schema is applied only to this disposable service, never to RDS or Supabase.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chalkwise_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Prepare disposable test database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: chalkwise_test
          PGPASSWORD: local-ci-only
        run: |
          psql -v ON_ERROR_STOP=1 -f server/infra/runtime-role.sql
          psql -v ON_ERROR_STOP=1 -f server/migrations/001_initial.sql
          psql -v ON_ERROR_STOP=1 -f server/migrations/002_review_events.sql
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE chalkwise_runtime LOGIN PASSWORD 'local-test-only' NOSUPERUSER NOBYPASSRLS; GRANT chalkwise_app TO chalkwise_runtime;"
      - name: Verify row-level access using the non-owner runtime login
        run: npm run test:db --prefix server
        env:
          TEST_DATABASE_URL: postgres://chalkwise_runtime:local-test-only@localhost:5432/chalkwise_test
      - name: Build API container
        run: docker build -f server/Dockerfile -t chalkwise-api:test .
      - name: Verify container startup against the disposable database
        env:
          TEST_DATABASE_URL: postgres://chalkwise_runtime:local-test-only@localhost:5432/chalkwise_test
        run: |
          docker run --detach --name chalkwise-api-smoke --network host \
            --env NODE_ENV=test --env DATABASE_CA_FILE= \
            --env DATABASE_URL="$TEST_DATABASE_URL" \
            --env AWS_REGION=us-east-1 --env COGNITO_USER_POOL_ID=us-east-1_CiTest \
            --env COGNITO_CLIENT_ID=citestpublicclient --env S3_BUCKET=ci-private-materials \
            chalkwise-api:test
          trap 'docker logs chalkwise-api-smoke; docker rm --force chalkwise-api-smoke' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3001/health/ready; then
              status=$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/v1/me)
              test "$status" = 401
              docker stop --time 10 chalkwise-api-smoke
              test "$(docker inspect --format '{{.State.ExitCode}}' chalkwise-api-smoke)" = 0
              exit 0
            fi
            sleep 1
          done
          exit 1
